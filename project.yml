name: TigerDroppings
options:
  bundleIdPrefix: com.danielarbour
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 6FU8ZY7A39
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "4"
targets:
  TigerDroppings:
    type: application
    platform: iOS
    sources:
      - path: TigerDroppings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danielarbour.tigerdroppings
        PRODUCT_NAME: TigerDroppings
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: TigerDroppings/Info.plist
        SWIFT_STRICT_CONCURRENCY: minimal
    info:
      path: TigerDroppings/Info.plist
      properties:
        CFBundleDisplayName: TD Live
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
